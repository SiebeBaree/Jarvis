name: Jarvis
options:
  bundleIdPrefix: com.siebebaree
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  JarvisAPI:
    path: Packages/JarvisAPI
  DesignSystem:
    path: Packages/DesignSystem

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DW92YAHZVK
  configs:
    Debug:
      # Ad-hoc signing so simulator and local Mac builds work without touching
      # the developer account. Real iPhones need a real certificate, so device
      # builds fall back to the automatic "Apple Development" identity.
      CODE_SIGN_IDENTITY: "-"
      "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development

targets:
  Jarvis:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Jarvis
    dependencies:
      - package: JarvisAPI
      - package: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siebebaree.jarvis
        TARGETED_DEVICE_FAMILY: "1" # iPhone only (no iPad)
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Jarvis/Info.plist
      properties:
        UILaunchScreen: {}
        LSApplicationCategoryType: public.app-category.productivity
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Jarvis/Jarvis.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  JarvisTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - JarvisTests
    dependencies:
      - target: Jarvis
    settings:
      base:
        # The bundle has no Info.plist of its own; without this, signing the
        # test bundle for the simulator fails.
        GENERATE_INFOPLIST_FILE: YES

# Explicit scheme so `xcodebuild test` has a test action to run — the implicit
# target schemes only know how to build.
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JarvisTests
